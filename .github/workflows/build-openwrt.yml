name: Build OpenWrt

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  #REPO_URL: https://github.com/sagehou/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 360t7.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        type: boolean
        required: false
        default: false
#  schedule:
#    - cron: 0 8 */5 * *

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: true
        
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-mark hold grub-efi-amd64-signed
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH --single-branch openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: owenthereal/action-upterm@v1.15.0
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}
      with:
        limit-access-to-actor: false

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v7.0.1
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        python3 - <<'PYTHON'
        import hashlib
        import json
        import os
        from pathlib import Path

        root = Path('.')
        renamed = {}
        for path in sorted(root.glob('*.bin')):
            name = f"{path.stem}{os.environ['FILE_DATE']}{path.suffix}"
            if (root / name).exists():
                raise FileExistsError(name)
            path.rename(root / name)
            renamed[path.name] = name

        profiles = root / 'profiles.json'
        if profiles.exists():
            data = json.loads(profiles.read_text())
            for profile in data.get('profiles', {}).values():
                for image in profile.get('images', []):
                    if image.get('name') in renamed:
                        image['name'] = renamed[image['name']]
            profiles.write_text(json.dumps(data, indent=2) + '\n')

        # Update filenames and hashes, including the changed profiles.json.
        sums = root / 'sha256sums'
        lines = []
        for line in sums.read_text().splitlines():
            _, name = line.split(None, 1)
            marker = '*' if name.startswith('*') else ' '
            name = name.removeprefix('*')
            name = renamed.get(name, name)
            digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
            lines.append(f"{digest} {marker}{name}\n")
        sums.write_text(''.join(lines))
        PYTHON
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7.0.1
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        upstream_version=$(cat "$FIRMWARE/version.buildinfo")
        upstream_commit=$(git -C openwrt rev-parse HEAD)
        echo "release_name=$(date +'%Y.%m.%d-%H%M') | $upstream_version" >> "$GITHUB_OUTPUT"
        {
          echo "- 上游版本：$upstream_version"
          echo "- 上游分支：$REPO_BRANCH"
          echo "- 上游提交：[$upstream_commit]($REPO_URL/commit/$upstream_commit)"
          echo "- 构建完成时间：${FILE_DATE#_}（Asia/Shanghai）"
          echo
          echo '软件包版本请查看 manifest；各 feeds 提交见 feeds.buildinfo。'
        } > release.txt
        python3 - <<'PYTHON' >> release.txt
        import os
        import re
        from pathlib import Path

        print('\n| Feed | 构建使用的提交 |')
        print('| --- | --- |')
        for line in (Path(os.environ['FIRMWARE']) / 'feeds.buildinfo').read_text().splitlines():
            if not line.strip() or line.lstrip().startswith('#'):
                continue
            kind, name, source = line.split(maxsplit=2)
            url, pinned, revision = source.rpartition('^')
            if pinned and re.fullmatch(r'[0-9a-fA-F]{40}', revision):
                url = url.split(';', 1)[0].removesuffix('.git')
                value = f'`{revision[:12]}`'
                if url.startswith('https://github.com/'):
                    value = f'[{value}]({url}/commit/{revision})'
            else:
                value = '`' + source.replace('|', '\\|') + '`'
            print(f'| {name} | {value} |')
        print()
        PYTHON
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3.0.2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_name }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2.1.0
      with:
        retain_days: 1
        keep_minimum_runs: 10

    - name: Remove old Releases
      uses: actions/github-script@v9.0.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const cleanupReleases = require('./.github/scripts/delete-old-releases')
          await cleanupReleases({ github, context, core })
